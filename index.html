<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversas · Yalla</title>
<style>
:root{--bg:#0b141a;--panel:#0f1b2d;--panel2:#002A69;--in:#1a2942;--out:#0a5c4b;--txt:#e9edef;--txt2:#8fa3bf;--accent:#FFC21B;--navy:#002A69;--border:#1c3050;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#002A69,#001a40);z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
#gate img{width:150px;height:auto;margin-bottom:6px;border-radius:6px}
#gate h2{font-size:18px;color:#fff;font-weight:600}
#gate p{font-size:13px;color:#b9c7de;max-width:340px}
.app{display:flex;height:100vh}
.sidebar{width:380px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sbhead{padding:12px 16px;background:var(--navy);display:flex;align-items:center;gap:10px}
.sbhead img{height:34px;width:auto;border-radius:4px}
.sbhead .count{font-size:12px;color:#b9c7de;margin-left:auto}
.search{padding:8px 12px;background:var(--panel)}
.search input{width:100%;padding:9px 14px;border-radius:8px;border:none;background:var(--panel2);color:var(--txt);font-size:14px;outline:none}
.search input::placeholder{color:#8fa3bf}
.list{flex:1;overflow-y:auto}
.item{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.item:hover,.item.active{background:var(--panel2)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .nome{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .data{font-size:11px;color:var(--txt2);white-space:nowrap}
.item .prev{font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11px;color:var(--txt2)}
.chat{flex:1;display:flex;flex-direction:column;background:#0b141a}
.chathead{padding:12px 20px;background:var(--navy);border-bottom:1px solid var(--border);min-height:60px;display:flex;flex-direction:column;justify-content:center}
.chathead .nome{font-size:16px;font-weight:600}.chathead .sub{font-size:12px;color:#b9c7de}
.msgs{flex:1;overflow-y:auto;padding:20px 8%;display:flex;flex-direction:column;gap:6px}
.empty{margin:auto;color:var(--txt2);text-align:center}
.bubble{max-width:65%;padding:7px 11px 8px;border-radius:8px;font-size:14px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.bubble.customer{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
.bubble.operator{align-self:flex-end;background:var(--out);border-top-right-radius:2px}
.bubble .at{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.bubble .ts{font-size:10px;color:#b9c7de;text-align:right;margin-top:3px}
.filtros{padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.filtros .atalhos{display:flex;gap:4px;flex-wrap:wrap}
.filtros .atalhos button{flex:1;min-width:44px;padding:5px 6px;border:none;border-radius:6px;background:var(--panel2);color:var(--txt2);font-size:11px;cursor:pointer}
.filtros .atalhos button:hover,.filtros .atalhos button.on{background:var(--accent);color:#002A69;font-weight:600}
.filtros .datas{display:flex;gap:5px;align-items:center}
.filtros .datas input{flex:1;min-width:0;padding:5px 7px;border:none;border-radius:6px;background:var(--panel2);color:var(--txt);font-size:11px;outline:none;color-scheme:dark}
.filtros .datas span{font-size:11px;color:var(--txt2)}
.filtros .aplicar{display:flex;gap:5px}
.filtros .aplicar button{flex:1;padding:6px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.filtros .aplicar .go{background:var(--accent);color:#002A69;font-weight:600}
.filtros .aplicar .clr{background:var(--in);color:var(--txt2)}
.msgfiltro{text-align:center;font-size:11px;color:var(--accent);padding:4px;background:rgba(255,194,27,.08)}
.loader{margin:auto;color:var(--txt2)}
.back{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;margin-right:6px}
@media(max-width:720px){.sidebar{width:100%;position:absolute;z-index:2;height:100%}.sidebar.hide{display:none}.chat{width:100%}.back{display:inline-block}}
</style>

<script>
const SB_URL="https://penyfjmgfeqvgzhuffmr.supabase.co";
const SB_KEY="sb_publishable_3RTDTAgrgJvLNexNXEgfVg_mcu-cKqO";
const CHAVE="HxXzyDCb8RVp";

const hash=location.hash.replace(/^#/,'');
if(hash!==CHAVE){/* acesso negado */}
else{
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  window.addEventListener('DOMContentLoaded',start);
  if(document.readyState!=='loading')start();
}

let listEl,qEl,msgsEl,headEl,countEl,sidebar,activeId=null,buscaTimer=null;
let fIni=null,fFim=null;  // filtro de periodo (texto "YYYY-MM-DD HH:MM:SS")

function api(path,extra){
  const h={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
  if(extra)Object.assign(h,extra);
  return fetch(SB_URL+"/rest/v1/"+path,{headers:h});
}

async function start(){
  listEl=document.getElementById('list');qEl=document.getElementById('q');msgsEl=document.getElementById('msgs');
  headEl=document.getElementById('chathead');countEl=document.getElementById('count');sidebar=document.getElementById('sidebar');
  // contar total
  try{
    const r=await api("contatos?select=id&limit=1",{Prefer:"count=exact"});
    const cr=r.headers.get("content-range");
    const totC=cr&&cr.includes("/")?parseInt(cr.split("/")[1]):null;
    let txt=totC?totC.toLocaleString('pt-BR')+" contatos":"— contatos";
    try{
      const rm=await api("mensagens?select=id&limit=1",{Prefer:"count=exact"});
      const crm=rm.headers.get("content-range");
      const totM=crm&&crm.includes("/")?parseInt(crm.split("/")[1]):null;
      if(totM){
        const mm=totM>=1000000?(totM/1000000).toFixed(1).replace('.',',')+"M":totM.toLocaleString('pt-BR');
        txt+=" · "+mm+" msgs";
      }
    }catch(e){}
    countEl.textContent=txt;
  }catch(e){}
  carregar("");
  qEl.oninput=()=>{clearTimeout(buscaTimer);buscaTimer=setTimeout(()=>carregar(qEl.value.trim()),350);};
  document.querySelectorAll('#atalhos button').forEach(b=>{b.onclick=()=>atalho(parseInt(b.dataset.d),b);});
}

async function carregar(termo){
  listEl.innerHTML='<div class="loader" style="padding:20px">Carregando…</div>';
  try{
    let ids=null;
    // Se há filtro de período, primeiro descobre quais contatos têm mensagem no período
    if(fIni||fFim){
      let mp="mensagens?select=contato_id&limit=100000";
      if(fIni)mp+="&data_hora=gte."+encodeURIComponent(fIni);
      if(fFim)mp+="&data_hora=lte."+encodeURIComponent(fFim);
      const rm=await api(mp); const mm=await rm.json();
      ids=[...new Set(mm.map(x=>x.contato_id))];
      if(!ids.length){listEl.innerHTML='<div style="padding:20px;color:#8696a0">Nenhuma conversa nesse período</div>';return;}
    }
    let path="contatos?select=id,nome,tel,n_msgs,ultima_data,preview&order=ultima_data.desc&limit=300";
    const filtros=[];
    if(termo){const t=encodeURIComponent("%"+termo+"%");filtros.push("or=(nome.ilike."+t+",tel.ilike."+t+")");}
    if(ids){
      // limitar a lista de ids (Supabase aceita in.(...))
      const lista=ids.slice(0,1000).map(x=>'"'+x+'"').join(",");
      filtros.push("id=in.("+lista+")");
    }
    if(filtros.length)path+="&"+filtros.join("&");
    const r=await api(path); const dados=await r.json();
    if(!dados.length){listEl.innerHTML='<div style="padding:20px;color:#8696a0">Nada encontrado</div>';return;}
    listEl.innerHTML=dados.map(c=>`<div class="item ${c.id===activeId?'active':''}" onclick="abrir('${c.id}')">
      <div class="top"><span class="nome">${esc(c.nome)}</span><span class="data">${fmtData(c.ultima_data)}</span></div>
      <div class="prev">${esc(c.preview||'')}</div>
      <div class="meta">${c.tel?fmtTel(c.tel):''} · ${c.n_msgs} msgs</div></div>`).join('');
  }catch(e){listEl.innerHTML='<div style="padding:20px;color:#f88">Erro ao carregar<br><small>'+e+'</small></div>';}
}

async function abrir(id){
  activeId=id;
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  if(window.innerWidth<=720)sidebar.classList.add('hide');
  msgsEl.innerHTML='<div class="loader">Carregando conversa…</div>';
  try{
    const rc=await api("contatos?select=nome,tel,n_msgs&id=eq."+encodeURIComponent(id));
    const c=(await rc.json())[0]||{};
    headEl.innerHTML=`<span class="nome"><button class="back" onclick="document.getElementById('sidebar').classList.remove('hide')">‹</button>${esc(c.nome||'')}</span><span class="sub">${c.tel?fmtTel(c.tel):'sem telefone'} · ${c.n_msgs||0} mensagens</span>`;
    const rm=await api("mensagens?select=de,conteudo,data_hora,atendente&contato_id=eq."+encodeURIComponent(id)+"&order=data_hora.asc&limit=5000");
    const ms=await rm.json();
    msgsEl.innerHTML=ms.map(m=>{
      const t=m.conteudo||'';
      if((m.de==='operator')&&(t.includes('Atendimento iniciado')||t.includes('Atendimento finalizado')))
        return `<div class="empty" style="margin:4px auto;font-size:12px;background:#0f1b2d;padding:5px 12px;border-radius:6px">${esc(t)}</div>`;
      const cls=m.de==='customer'?'customer':'operator';
      return `<div class="bubble ${cls}">${m.atendente?`<div class="at">${esc(m.atendente)}</div>`:''}${esc(t)}<div class="ts">${fmtDataHora(m.data_hora)}</div></div>`;
    }).join('');
    msgsEl.scrollTop=0;
  }catch(e){msgsEl.innerHTML='<div class="empty">Erro ao carregar conversa</div>';}
}

function fmtDT(d){ // Date -> "YYYY-MM-DD HH:MM:SS"
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function aplicarFiltro(){
  const i=document.getElementById('dtIni').value, f=document.getElementById('dtFim').value;
  fIni=i?i.replace('T',' ')+":00":null;
  fFim=f?f.replace('T',' ')+":59":null;
  document.querySelectorAll('#atalhos button').forEach(b=>b.classList.remove('on'));
  carregar(qEl.value.trim());
}
function limparFiltro(){
  fIni=fFim=null;
  document.getElementById('dtIni').value='';document.getElementById('dtFim').value='';
  document.querySelectorAll('#atalhos button').forEach(b=>b.classList.remove('on'));
  document.querySelector('#atalhos button[data-d="-1"]').classList.add('on');
  carregar(qEl.value.trim());
}
function atalho(dias,btn){
  document.querySelectorAll('#atalhos button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(dias<0){fIni=fFim=null;document.getElementById('dtIni').value='';document.getElementById('dtFim').value='';}
  else{
    const fim=new Date(); const ini=new Date();
    if(dias===0){ini.setHours(0,0,0,0);}
    else{ini.setDate(ini.getDate()-dias);ini.setHours(0,0,0,0);}
    fIni=fmtDT(ini); fFim=fmtDT(fim);
    const toLocal=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());};
    document.getElementById('dtIni').value=toLocal(ini);
    document.getElementById('dtFim').value=toLocal(fim);
  }
  carregar(qEl.value.trim());
}
function fmtData(s){ // "2026-08-13" -> "13/08/2026"
  if(!s)return'';
  const p=String(s).slice(0,10).split('-');
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;
}
function fmtDataHora(s){ // "2026-08-13 14:30" -> "13/08/2026 14:30"
  if(!s)return'';
  const str=String(s);
  const d=str.slice(0,10).split('-');
  const hora=str.slice(11,16);
  if(d.length!==3)return str;
  return `${d[2]}/${d[1]}/${d[0]}${hora?' '+hora:''}`;
}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTel(t){t=(t||'').replace(/\D/g,'');if(t.length===13)return `+${t.slice(0,2)} (${t.slice(2,4)}) ${t.slice(4,9)}-${t.slice(9)}`;return t}
